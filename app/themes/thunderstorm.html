<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100%; 
            height: 100%; 
            background: transparent; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            contain: strict; 
        }
    </style>
</head>
<body>
    <canvas id="thunder-canvas"></canvas>
    <script>
        const canvas = document.getElementById('thunder-canvas');
        const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
        
        let width, height, animationId;
        
        const STRIDE = 6;
        let rainBuckets = [new Float32Array(0), new Float32Array(0), new Float32Array(0)];
        const opacities = [0.14, 0.20, 0.26];
        let cloudsCanvas;
        
        let flashAlpha = 0;
        let strikeTimer = 60;
        const strikeSequence = [];
        const activeFlashes = [];

        let wrapX, wrapY, resetXMin, resetXRange;

        function initScene() {
            wrapX = width + 100;
            wrapY = height + 30;
            resetXMin = -200;
            resetXRange = width + 300;

            const rainCount = Math.floor((width * height) / 9000) + 120;
            const countPerBucket = Math.floor(rainCount / 3);

            for (let b = 0; b < 3; b++) {
                rainBuckets[b] = new Float32Array(countPerBucket * STRIDE);
                const bucket = rainBuckets[b];

                for (let i = 0; i < countPerBucket; i++) {
                    const idx = i * STRIDE;
                    const vy = Math.random() * 6 + 14;
                    const vx = Math.random() * 2 + 3;
                    const len = Math.random() * 12 + 15;

                    bucket[idx]     = Math.random() * resetXRange - 150;
                    bucket[idx + 1] = Math.random() * height - height;
                    bucket[idx + 2] = vx;
                    bucket[idx + 3] = vy;
                    bucket[idx + 4] = len;
                    bucket[idx + 5] = vx * (len / vy);
                }
            }

            cloudsCanvas = document.createElement('canvas');
            cloudsCanvas.width = width;
            const cloudMaxHeight = 160;
            cloudsCanvas.height = cloudMaxHeight + 90;
            const cctx = cloudsCanvas.getContext('2d');
            
            if (typeof cctx.filter !== 'undefined') {
                cctx.filter = 'blur(45px)';
            }
            
            const grad = cctx.createLinearGradient(0, 0, 0, cloudMaxHeight);
            grad.addColorStop(0, 'rgba(10, 12, 20, 0.98)');
            grad.addColorStop(0.7, 'rgba(8, 10, 16, 0.95)');
            grad.addColorStop(1, '#030407');
            
            cctx.fillStyle = grad;
            cctx.beginPath();
            cctx.moveTo(0, 0);
            cctx.lineTo(0, 90);
            cctx.bezierCurveTo(width * 0.35, 150, width * 0.65, 80, width, 110);
            cctx.lineTo(width, 0);
            cctx.closePath();
            cctx.fill();

            strikeSequence.length = 0;
            activeFlashes.length = 0;
            strikeTimer = Math.floor(Math.random() * 80) + 40;
        }

        function triggerLightningStrike(intensity = 1.0) {
            flashAlpha = intensity;
            activeFlashes.length = 0;
            
            const flashCount = Math.random() < 0.4 ? 2 : 1;
            
            for (let i = 0; i < flashCount; i++) {
                const r = Math.random() * (width * 0.3) + (width * 0.4);
                const maxAlpha = Math.random() * 0.25 + 0.7;
                const x = Math.random() * width;
                const y = Math.random() * 120 - 40;

                const grad = ctx.createRadialGradient(x, y, 5, x, y, r);
                grad.addColorStop(0, `rgba(255, 255, 255, ${maxAlpha})`);
                grad.addColorStop(0.12, `rgba(180, 220, 255, ${maxAlpha * 0.8})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                activeFlashes.push({ x, y, r, grad });
            }
        }

        function resize() { 
            width = canvas.width = window.innerWidth; 
            height = canvas.height = window.innerHeight; 
            initScene();
        }
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resize, 100);
        }); 
        resize();

        function loop() {
            ctx.clearRect(0, 0, width, height);

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(185, 215, 255, ${flashAlpha * 0.22})`;
                ctx.fillRect(0, 0, width, height);
            }

            if (flashAlpha > 0 && activeFlashes.length > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = flashAlpha;
                for (let i = 0; i < activeFlashes.length; i++) {
                    const f = activeFlashes[i];
                    ctx.fillStyle = f.grad;
                    ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
                }
                ctx.restore();

                flashAlpha *= 0.90; 
                if (flashAlpha < 0.02) {
                    flashAlpha = 0;
                    activeFlashes.length = 0;
                }
            }

            ctx.drawImage(cloudsCanvas, 0, -45);

            if (strikeSequence.length > 0) {
                for (let i = strikeSequence.length - 1; i >= 0; i--) {
                    const s = strikeSequence[i];
                    s.delay--;
                    if (s.delay <= 0) {
                        triggerLightningStrike(s.intensity);
                        strikeSequence.splice(i, 1);
                    }
                }
            } else {
                strikeTimer--;
                if (strikeTimer <= 0) {
                    const isDouble = Math.random() > 0.4;
                    strikeSequence.push({ delay: 1, intensity: 1.0 });
                    if (isDouble) {
                        strikeSequence.push({ delay: Math.floor(Math.random() * 12) + 8, intensity: 0.6 });
                    }
                    strikeTimer = Math.floor(Math.random() * 120) + 60; 
                }
            }

            ctx.lineWidth = 1.2;
            for (let b = 0; b < 3; b++) {
                ctx.strokeStyle = `rgba(165, 195, 225, ${opacities[b]})`;
                ctx.beginPath();
                
                const bucket = rainBuckets[b];
                const len = bucket.length;

                for (let i = 0; i < len; i += STRIDE) {
                    let rx = bucket[i];
                    let ry = bucket[i + 1];
                    const rvx = bucket[i + 2];
                    const rvy = bucket[i + 3];
                    const rlen = bucket[i + 4];
                    const rdx = bucket[i + 5];

                    ctx.moveTo(rx, ry);
                    ctx.lineTo(rx + rdx, ry + rlen);

                    rx += rvx;
                    ry += rvy;

                    if (ry > wrapY || rx > wrapX) {
                        ry = Math.random() * -50;
                        rx = Math.random() * resetXRange + resetXMin;
                    }

                    bucket[i] = rx;
                    bucket[i + 1] = ry;
                }
                ctx.stroke();
            }

            animationId = requestAnimationFrame(loop);
        }

        function start() { if (!animationId) loop(); }
        function stop() { cancelAnimationFrame(animationId); animationId = null; }

        window.addEventListener('message', (e) => {
            if (e.data.type === 'stop') stop();
            if (e.data.type === 'start') start();
        });

        start();
    </script>
</body>
</html>
