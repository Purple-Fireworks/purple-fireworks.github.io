<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: transparent; }
        canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="thunder-canvas"></canvas>
    <script>
        const canvas = document.getElementById('thunder-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, animationId;
        
        let rainBuckets = [[], [], []];
        const opacities = [0.14, 0.20, 0.26];
        let cloudsCanvas;
        
        let flashAlpha = 0;
        let strikeTimer = 60;
        let strikeSequence = [];
        let activeFlashes = [];

        let wrapX, wrapY, resetXMin, resetXRange;

        const PI2 = Math.PI * 2;

        function initScene() {
            wrapX = width + 100;
            wrapY = height + 30;
            resetXMin = -200;
            resetXRange = width + 300;

            rainBuckets = [[], [], []];
            const rainCount = Math.floor((width * height) / 9000) + 120;
            for (let i = 0; i < rainCount; i++) {
                const vy = Math.random() * 6 + 14;
                const vx = Math.random() * 2 + 3;
                const len = Math.random() * 12 + 15;
                const bucketIndex = Math.floor(Math.random() * 3);
                
                rainBuckets[bucketIndex].push({
                    x: Math.random() * resetXRange - 150,
                    y: Math.random() * height - height,
                    vy: vy,
                    vx: vx,
                    len: len,
                    dx: vx * (len / vy)
                });
            }

            cloudsCanvas = document.createElement('canvas');
            cloudsCanvas.width = width;
            
            const cloudMaxHeight = 160;
            const pad = 90;
            cloudsCanvas.height = cloudMaxHeight + pad;
            const cctx = cloudsCanvas.getContext('2d');
            
            if (typeof cctx.filter !== 'undefined') {
                cctx.filter = 'blur(45px)';
            }
            
            const grad = cctx.createLinearGradient(0, 0, 0, cloudMaxHeight);
            grad.addColorStop(0, 'rgba(10, 12, 20, 0.98)');
            grad.addColorStop(0.7, 'rgba(8, 10, 16, 0.95)');
            grad.addColorStop(1, '#030407');
            
            cctx.fillStyle = grad;
            cctx.beginPath();
            cctx.moveTo(0, 0);
            cctx.lineTo(0, 90);
            cctx.bezierCurveTo(width * 0.35, 150, width * 0.65, 80, width, 110);
            cctx.lineTo(width, 0);
            cctx.closePath();
            cctx.fill();

            strikeSequence = [];
            activeFlashes = [];
            strikeTimer = Math.floor(Math.random() * 80) + 40;
        }

        function triggerLightningStrike(intensity = 1.0) {
            flashAlpha = intensity;
            activeFlashes = [];
            
            const flashCount = Math.random() < 0.4 ? 2 : 1;
            
            for (let i = 0; i < flashCount; i++) {
                const r = Math.random() * (width * 0.3) + (width * 0.4);
                const maxAlpha = Math.random() * 0.25 + 0.7;
                const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, r);
                
                grad.addColorStop(0, `rgba(255, 255, 255, ${maxAlpha})`);
                grad.addColorStop(0.12, `rgba(180, 220, 255, ${maxAlpha * 0.8})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                activeFlashes.push({
                    x: Math.random() * width,
                    y: Math.random() * 120 - 40,
                    r: r,
                    grad: grad
                });
            }
        }

        function resize() { 
            width = canvas.width = window.innerWidth; 
            height = canvas.height = window.innerHeight; 
            initScene();
        }
        window.addEventListener('resize', resize); 
        resize();

        function loop() {
            ctx.clearRect(0, 0, width, height);

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(185, 215, 255, ${flashAlpha * 0.22})`;
                ctx.fillRect(0, 0, width, height);
            }

            if (flashAlpha > 0 && activeFlashes.length > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = flashAlpha;
                activeFlashes.forEach(f => {
                    ctx.translate(f.x, f.y);
                    ctx.fillStyle = f.grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, f.r, 0, PI2);
                    ctx.fill();
                    ctx.translate(-f.x, -f.y);
                });
                ctx.restore();
            }

            if (flashAlpha > 0) {
                flashAlpha *= 0.90; 
                if (flashAlpha < 0.02) {
                    flashAlpha = 0;
                    activeFlashes = [];
                }
            }

            ctx.drawImage(cloudsCanvas, 0, -45);

            if (strikeSequence.length > 0) {
                strikeSequence.forEach(s => {
                    s.delay--;
                    if (s.delay === 0) {
                        triggerLightningStrike(s.intensity);
                    }
                });
                strikeSequence = strikeSequence.filter(s => s.delay > 0);
            } else {
                strikeTimer--;
                if (strikeTimer <= 0) {
                    const isDouble = Math.random() > 0.4;
                    strikeSequence.push({ delay: 1, intensity: 1.0 });
                    if (isDouble) {
                        strikeSequence.push({ delay: Math.floor(Math.random() * 12) + 8, intensity: 0.6 });
                    }
                    strikeTimer = Math.floor(Math.random() * 120) + 60; 
                }
            }

            ctx.lineWidth = 1.2;
            for (let b = 0; b < 3; b++) {
                ctx.strokeStyle = `rgba(165, 195, 225, ${opacities[b]})`;
                ctx.beginPath();
                const bucket = rainBuckets[b];
                const len = bucket.length;
                for (let i = 0; i < len; i++) {
                    const r = bucket[i];
                    ctx.moveTo(r.x, r.y);
                    ctx.lineTo(r.x + r.dx, r.y + r.len);

                    r.x += r.vx;
                    r.y += r.vy;

                    if (r.y > wrapY || r.x > wrapX) {
                        r.y = Math.random() * -50;
                        r.x = Math.random() * resetXRange + resetXMin;
                    }
                }
                ctx.stroke();
            }

            animationId = requestAnimationFrame(loop);
        }

        function start() { if (!animationId) loop(); }
        function stop() { cancelAnimationFrame(animationId); animationId = null; }

        window.addEventListener('message', (e) => {
            if (e.data.type === 'stop') stop();
            if (e.data.type === 'start') start();
        });

        start();
    </script>
</body>
</html>
